seo:
  title: AI Receptionist & Follow-Up for Med Spas — Benson Gitau
  description: >-
    Stop losing consultations to voicemail. Calls answered, leads followed up
    and no-shows recovered, connected to your booking platform.
hero:
  eyebrow: For med spas and aesthetic clinics
  personalisedEyebrow: Built for {spa}
  headline: Your next consultation is calling while you're *mid-treatment*.
  subline: >-
    I build the system that answers every call, follows up every lead and fills
    empty slots, connected to the booking platform you already use.
  primaryCta: Book a 15-minute walkthrough
  secondaryCta: Watch the 90-second demo ↓
demoVideo:
  youtubeId: '[MEDSPA_DEMO_YOUTUBE_ID]'
  title: Every call answered and booked, even mid-treatment
  poster:
    image: null
    alt: ''
  transcript: '[MEDSPA_DEMO_TRANSCRIPT]'
  durationLabel: 90s
leaks:
  heading: Where bookings *leak*
  items:
    - >-
      Calls during treatments and after hours go to voicemail, and most callers
      book elsewhere.
    - Ad and website leads wait hours for a reply.
    - No-shows and lapsed clients leave empty slots that nobody follows up.
    - Your team retypes between the booking platform, CRM and marketing tools.
system:
  heading: The *system*
  steps:
    - title: Call or lead
      description: A call, missed call, form or ad lead comes in.
    - title: Instant response
      description: The AI receptionist answers, or a text goes out within seconds.
    - title: Booked
      description: The consultation lands in your calendar.
    - title: Reminders
      description: Confirmations and reminders cut no-shows.
    - title: Review request
      description: Happy clients are asked for a Google review.
    - title: Rebooking
      description: Clients are invited back at the right treatment interval.
offers:
  heading: Where to *start*
  items:
    - title: Missed-call text-back and no-show recovery
      text: The fastest win, live in days.
    - title: AI receptionist
      text: Every call answered and booked; clinical questions go to your team.
    - title: Reactivation and reviews
      text: Past clients rebooked and more Google reviews.
  alsoLine: >-
    Also available: treatment landing pages, speed-to-lead for ad leads, and
    GoHighLevel setup.
platforms:
  heading: Works with what you *use*
  chips:
    - GoHighLevel
    - Aesthetic Record
    - Boulevard
    - Vagaro
    - Zenoti
  text: >-
    Every booking platform allows different connections. Before you commit, I
    check what yours supports and tell you exactly what will and won't connect.
safeguards:
  heading: Handled *carefully*
  items:
    - Medical and treatment details stay out of texts and call summaries.
    - Leads are only called with their consent; opt-outs are automatic.
    - US texting is registered (A2P) so messages actually deliver.
    - >-
      We review each tool's data terms, including BAAs where needed, before
      building.
proof:
  heading: Proof
  project: med-spa-ai-receptionist
  line: >-
    For an e-commerce client, the same capture-and-follow-up approach cut manual
    operational oversight by roughly 80%.
faq:
  heading: FAQ
  items:
    - q: Will patients know it's AI?
      a: It introduces itself as your virtual assistant; you approve the wording.
    - q: Do I need to change booking software?
      a: >-
        No. I work with your current platform where it allows, or set up
        GoHighLevel alongside it.
    - q: How long does it take?
      a: >-
        Text-back and reminders in under a week; an AI receptionist in about two
        weeks.
    - q: What does it cost to run?
      a: >-
        Phone and AI minutes are billed to your own accounts; I estimate them
        before building.
    - q: What if it gets something wrong?
      a: >-
        It answers only from your approved information, hands off when unsure,
        and every call is recorded for review.
finalCta:
  heading: See what this would look like for *your spa*.
  text: >-
    15 minutes. I'll map where your bookings leak and show you the system I'd
    build first.
  emailLine: Prefer email? Reply to the message I sent you.
