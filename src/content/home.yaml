process:
  eyebrow: / How a project runs
  heading: Here's how it works
  steps:
    - title: Audit
      text: >-
        A 20-minute call to find where leads stall: phones, forms, booking,
        follow-up.
    - title: Build
      text: >-
        A flow map you approve, then the build inside your own GHL, Mindbody
        and n8n accounts.
    - title: Hand over
      text: >-
        Tested with real scenarios, then Loom walkthroughs, a runbook and
        support while it beds in.
